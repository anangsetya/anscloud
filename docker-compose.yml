services:
  anscloud:
    build: .
    container_name: anscloud
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent storage — keep these on a host directory or named volume.
      - ./data/db:/app/db        # SQLite database file (all metadata)
      - ./data/storage:/app/storage # Physical file blobs (demo mode only)
    environment:
      # Database
      - DATABASE_URL=file:/app/db/custom.db

      # Login credentials — READ FROM .env FILE (docker-compose auto-loads it)
      - ANSCLOUD_LOGIN_EMAIL=${ANSCLOUD_LOGIN_EMAIL}
      - ANSCLOUD_LOGIN_PASSWORD_HASH=${ANSCLOUD_LOGIN_PASSWORD_HASH}

      # NextAuth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}

      # Google Drive OAuth (OPTIONAL — uncomment in .env to enable)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ANSCLOUD_PUBLIC_URL=${ANSCLOUD_PUBLIC_URL:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/auth/csrf"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
