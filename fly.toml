# ───────────────────────────────────────────────────────────────────────────
# Fly.io configuration for AnsCloud
#
# Free tier covers:
#   - 1 shared-cpu-1x VM with 256MB RAM
#   - 3GB persistent volume (mounted at /app/data)
#   - 160GB outbound bandwidth/month
#   - HTTPS via *.fly.dev subdomain (or custom domain)
# ───────────────────────────────────────────────────────────────────────────

app = "anscloud"  # Change to your-app-name (must be unique on fly.io)
primary_region = "sin"  # Singapore — change to closest region:
#  sea = Seattle, sjc = San Jose, lhr = London, fra = Frankfurt
#  nrt = Tokyo, sin = Singapore, syd = Sydney

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "file:/app/data/db/custom.db"
  PORT = "3000"

# Mount persistent volume — keeps SQLite DB + file blobs across restarts
[[mounts]]
  source = "anscloud_data"
  destination = "/app/data"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "3GB"

# HTTP service
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false  # Keep running to avoid cold starts
  auto_start_machines = true
  min_machines_running = 0  # 0 = stop when idle (saves free hours); 1 = always running

# Health check
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/api/auth/csrf"
  protocol = "http"

# Resource limits — fit in free tier
[[vm]]
  size = "shared-cpu-1x"
  memory = 256  # MB — minimum for Next.js standalone + Prisma
  cpu_kind = "shared"
  cpus = 1
